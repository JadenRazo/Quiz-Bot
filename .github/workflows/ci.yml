name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.11"

jobs:
  workflow-policy:
    name: Workflow supply-chain policy
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - run: scripts/check-workflow-security.test.sh && scripts/check-workflow-security.sh

  test:
    name: Python quality and tests
    runs-on: ubuntu-latest
    needs: workflow-policy
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:15@sha256:9b1d34adbce1dd07ee6e94b4a2cf698884b89bd44a6c9c12f5da8f3acbfe4957
        env:
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_pass
          POSTGRES_DB: test_quizbot
        options: >-
          --health-cmd "pg_isready -U test_user"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
      redis:
        image: redis:7-alpine@sha256:ff02b58f971e7d7d156a1267e283fcbbeee91773b6aa36c49dac28ecfe28eadf
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-ci.txt
      - name: Install dependencies
        run: |
          python -m pip install pip==26.2.1
          python -m pip install --requirement requirements.txt --requirement requirements-ci.txt
      - name: Reject fatal Python errors
        run: python -m flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
      - name: Audit Python dependencies
        run: python -m pip_audit --requirement requirements.txt --strict
      - name: Scan for high-severity Python issues
        run: python -m bandit --recursive . --severity-level high --exclude ./.git,./tests
      - name: Run tests
        env:
          DB_HOST: localhost
          DB_PORT: 5432
          DB_NAME: test_quizbot
          DB_USER: test_user
          DB_PASSWORD: test_pass
          REDIS_HOST: localhost
          REDIS_PORT: 6379
          DISCORD_TOKEN: test_token_12345
          STANDARD_PROMPT: "Test standard prompt"
          EDUCATIONAL_PROMPT: "Test educational prompt"
          TRIVIA_PROMPT: "Test trivia prompt"
          CHALLENGE_PROMPT: "Test challenge prompt"
          TRUE_FALSE_PROMPT: "Test true/false prompt"
        run: python -m pytest tests/ -v --cov=. --cov-report=xml

  terraform-static:
    name: Terraform static validation
    runs-on: ubuntu-latest
    needs: workflow-policy
    timeout-minutes: 10
    defaults:
      run:
        working-directory: terraform/azure
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Set up Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4
        with:
          terraform_version: 1.15.7
      - name: Check formatting
        run: terraform fmt -check -recursive
      - name: Initialize without a backend
        run: terraform init -backend=false -input=false -lockfile=readonly
      - name: Validate configuration
        run: terraform validate -no-color
