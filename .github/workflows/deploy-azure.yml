name: Deploy to Azure (retired, manual recovery only)

on:
  # push:main trigger removed 2026-05-16: the Azure subscription for this
  # project no longer exists, so every push to main failed at "Azure Login"
  # ("No subscriptions found") and emailed. Keep this manual-only; any future
  # production path must be restored through review and the production gate.
  workflow_dispatch:
    inputs:
      confirmation:
        description: Type deploy-retired-azure after restoring Azure and the Dockerfile
        required: true
        type: string

concurrency:
  group: deploy-azure-production
  cancel-in-progress: false

permissions:
  contents: read

env:
  AZURE_CONTAINER_REGISTRY: quizbotacr
  CONTAINER_NAME: quiz-bot
  RESOURCE_GROUP: quiz-bot-rg
  TERRAFORM_VERSION: 1.6.0

jobs:
  preflight:
    name: Confirm retired deployment prerequisites
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
    - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
    - name: Refuse an accidental or incomplete recovery deploy
      env:
        CONFIRMATION: ${{ inputs.confirmation }}
      run: |
        if [[ "$CONFIRMATION" != "deploy-retired-azure" ]]; then
          echo "::error::Confirmation must exactly match deploy-retired-azure"
          exit 1
        fi
        if [[ ! -f Dockerfile ]]; then
          echo "::error::Azure deployment remains retired: restore and review Dockerfile first"
          exit 1
        fi
        test -d terraform/azure

  build-and-push:
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    permissions:
      contents: read
      id-token: write
    outputs:
      image-tag: ${{ steps.meta.outputs.tags }}
      image-digest: ${{ steps.build.outputs.digest }}
    
    steps:
    - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
    
    - name: Azure Login
      uses: azure/login@7ddb5af1ef8758cf1353cf3b42f940aee27ba21c # v3.0.2
      with:
        client-id: ${{ secrets.AZURE_CLIENT_ID }}
        tenant-id: ${{ secrets.AZURE_TENANT_ID }}
        subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
    
    - name: Resolve and authenticate to ACR
      id: acr
      run: |
        ACR_LOGIN_SERVER=$(az acr show --name ${{ env.AZURE_CONTAINER_REGISTRY }} --query loginServer -o tsv)
        echo "login-server=$ACR_LOGIN_SERVER" >> $GITHUB_OUTPUT
        az acr login --name ${{ env.AZURE_CONTAINER_REGISTRY }}
    
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4
    
    - name: Docker meta
      id: meta
      uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
      with:
        images: |
          ${{ steps.acr.outputs.login-server }}/${{ env.CONTAINER_NAME }}
        tags: |
          type=raw,value=${{ github.sha }}
    
    - name: Build and push Docker image
      id: build
      uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
      with:
        context: .
        push: ${{ steps.acr.outputs.login-server != '' }}
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        cache-from: type=gha
        cache-to: type=gha,mode=max
        build-args: |
          BUILDTIME=${{ fromJSON(steps.meta.outputs.json).labels['org.opencontainers.image.created'] }}
          VERSION=${{ fromJSON(steps.meta.outputs.json).labels['org.opencontainers.image.version'] }}
          REVISION=${{ fromJSON(steps.meta.outputs.json).labels['org.opencontainers.image.revision'] }}

  terraform:
    needs: build-and-push
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    permissions:
      contents: read
      id-token: write
    
    steps:
    - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
    
    - name: Setup Terraform
      uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4
      with:
        terraform_version: ${{ env.TERRAFORM_VERSION }}
    
    - name: Azure Login
      uses: azure/login@7ddb5af1ef8758cf1353cf3b42f940aee27ba21c # v3.0.2
      with:
        client-id: ${{ secrets.AZURE_CLIENT_ID }}
        tenant-id: ${{ secrets.AZURE_TENANT_ID }}
        subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
    
    - name: Terraform Init
      working-directory: ./terraform/azure
      run: |
        terraform init \
          -lockfile=readonly \
          -backend-config="resource_group_name=${{ secrets.TF_STATE_RESOURCE_GROUP }}" \
          -backend-config="storage_account_name=${{ secrets.TF_STATE_STORAGE_ACCOUNT }}" \
          -backend-config="container_name=${{ secrets.TF_STATE_CONTAINER }}" \
          -backend-config="key=terraform.tfstate"
    
    - name: Terraform Apply
      working-directory: ./terraform/azure
      env:
        TF_VAR_discord_token: ${{ secrets.DISCORD_TOKEN }}
        TF_VAR_openai_api_key: ${{ secrets.OPENAI_API_KEY }}
        TF_VAR_anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
        TF_VAR_google_ai_api_key: ${{ secrets.GOOGLE_AI_API_KEY }}
        TF_VAR_alert_email: ${{ secrets.ALERT_EMAIL }}
        TF_VAR_bot_owner_id: ${{ secrets.BOT_OWNER_ID }}
        TF_VAR_bot_application_id: ${{ secrets.BOT_APPLICATION_ID }}
        TF_VAR_standard_prompt: ${{ secrets.STANDARD_PROMPT }}
        TF_VAR_educational_prompt: ${{ secrets.EDUCATIONAL_PROMPT }}
        TF_VAR_trivia_prompt: ${{ secrets.TRIVIA_PROMPT }}
        TF_VAR_challenge_prompt: ${{ secrets.CHALLENGE_PROMPT }}
        TF_VAR_true_false_prompt: ${{ secrets.TRUE_FALSE_PROMPT }}
        TF_VAR_allowed_ip_addresses: '["0.0.0.0/0"]'
        TF_VAR_image_tag: ${{ github.sha }}
      run: |
        terraform apply -auto-approve -input=false
    
    - name: Get deployment outputs
      id: terraform-output
      working-directory: ./terraform/azure
      run: |
        echo "app-url=$(terraform output -raw container_app_url)" >> $GITHUB_OUTPUT
        echo "resource-group=$(terraform output -raw resource_group_name)" >> $GITHUB_OUTPUT
        echo "container-app=$(terraform output -raw container_app_name)" >> $GITHUB_OUTPUT

  deploy:
    needs: [build-and-push, terraform]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    permissions:
      contents: read
      id-token: write
    
    steps:
    - name: Azure Login
      uses: azure/login@7ddb5af1ef8758cf1353cf3b42f940aee27ba21c # v3.0.2
      with:
        client-id: ${{ secrets.AZURE_CLIENT_ID }}
        tenant-id: ${{ secrets.AZURE_TENANT_ID }}
        subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
    
    - name: Deploy to Azure Container Apps
      run: |
        # Update the container app with the new image
        az containerapp update \
          --name quiz-bot-app \
          --resource-group ${{ env.RESOURCE_GROUP }} \
          --image ${{ needs.build-and-push.outputs.image-tag }}
    
    - name: Verify deployment
      run: |
        # Wait for deployment to complete
        echo "Waiting for deployment to stabilize..."
        sleep 30
        
        # Check container app status
        az containerapp show \
          --name quiz-bot-app \
          --resource-group ${{ env.RESOURCE_GROUP }} \
          --query "properties.runningStatus" -o tsv
    
    - name: Post deployment summary
      if: always()
      uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
      with:
        script: |
          const summary = core.summary
            .addHeading('🚀 Deployment Summary')
            .addTable([
              [{data: 'Status', header: true}, {data: '${{ job.status }}', header: false}],
              [{data: 'Environment', header: true}, {data: 'production', header: false}],
              [{data: 'Commit', header: true}, {data: '${{ github.sha }}', header: false}],
              [{data: 'Resource Group', header: true}, {data: '${{ env.RESOURCE_GROUP }}', header: false}],
              [{data: 'Container App', header: true}, {data: 'quiz-bot-app', header: false}]
            ])
            .addLink('View in Azure Portal', `https://portal.azure.com/#resource/subscriptions/${{ secrets.AZURE_SUBSCRIPTION_ID }}/resourceGroups/${{ env.RESOURCE_GROUP }}/providers/Microsoft.App/containerApps/quiz-bot-app/overview`);
          
          await summary.write();
